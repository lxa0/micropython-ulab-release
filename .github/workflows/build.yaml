name: Build RP2040 MicroPython with ulab
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y gcc-arm-none-eabi python3 git

      - name: Clone official MicroPython
        run: git clone https://github.com/micropython/micropython.git --depth 1

      - name: Clone ulab
        run: git clone https://github.com/v923z/micropython-ulab.git --depth 1

      - name: Copy ulab to modules
        run: cp -r micropython-ulab/code micropython/ports/rp2/modules/ulab

      - name: Build RP2040 firmware
        run: |
          cd micropython/ports/rp2
          make BOARD=RPI_PICO -j4

      - name: Upload firmware.uf2
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: micropython/ports/rp2/build-RPI_PICO/firmware.uf2
